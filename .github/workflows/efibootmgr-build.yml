name: Build efibootmgr

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-efibootmgr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build efibootmgr in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          sync: rsync
          run: |
            set -eux
            cd "$GITHUB_WORKSPACE"
            make -C usr.sbin/efibootmgr clean all
